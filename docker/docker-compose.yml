services:
  postgres:
    image: postgres:16-alpine
    container_name: proctor-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: proctor
      POSTGRES_PASSWORD: proctor
      POSTGRES_DB: proctor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U proctor"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: proctor-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

volumes:
  postgres_data:
