<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Proctor</title>
  <style>
    body {
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      width: 240px;
      padding: 14px;
      margin: 0;
      color: #1f2937;
    }
    h1 {
      font-size: 14px;
      margin: 0 0 8px 0;
      display: flex;
      align-items: center;
    }
    .dot {
      display: inline-block;
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #22c55e;
      margin-right: 8px;
    }
    p {
      font-size: 12px;
      color: #6b7280;
      margin: 0 0 6px 0;
      line-height: 1.4;
    }
    code {
      background: #f3f4f6;
      padding: 1px 4px;
      border-radius: 3px;
      font-size: 11px;
    }
  </style>
</head>
<body>
  <h1><span class="dot"></span>Proctor active</h1>
  <p>Monitoring is running. Press <code>F12</code> on any tab to see the event log in the page console, or inspect the service worker from <code>chrome://extensions</code>.</p>
</body>
</html>
